name = "gofv"
defaultTargets = ["GoFV"]

[[lean_lib]]
name = "GoFV"
globs = ["GoFV.+"]
# Linter warnings embed absolute paths in .oleans and defeat the shared cache (lean-build-hygiene).
weakLeanArgs = ["-Dlinter.unusedVariables=false", "-Dlinter.unusedSimpArgs=false", "-Dlinter.unnecessarySimpa=false", "-Dlinter.unusedSectionVars=false"]

[[lean_lib]]
name = "GoFVTest"
globs = ["GoFVTest.+"]
weakLeanArgs = ["-Dlinter.unusedVariables=false", "-Dlinter.unusedSimpArgs=false", "-Dlinter.unnecessarySimpa=false", "-Dlinter.unusedSectionVars=false"]

# lean_exe targets: each component appends its own [[lean_exe]] section below.
# Re-read this file right before editing it; other components edit it concurrently.

[[lean_exe]]
name = "ssa-roundtrip"
root = "GoFVTest.SSARoundtrip"

[[lean_exe]]
name = "util-difftest"
root = "GoFVTest.UtilDiff"

[[lean_exe]]
name = "pass-parity"
root = "GoFVTest.Parity.Main"

[[lean_exe]]
name = "analysis-difftest"
root = "GoFVTest.AnalysisDiff"

[[lean_exe]]
name = "sem-difftest"
root = "GoFVTest.SemDiff"

[[lean_exe]]
name = "ssa-check"
root = "GoFVTest.SSACheck"

[[lean_exe]]
name = "prove-difftest"
root = "GoFVTest.ProveDiff"

[[lean_exe]]
name = "copyrel-probe"
root = "GoFVTest.CopyRelProbe"

[[lean_exe]]
name = "zcse-probe"
root = "GoFVTest.ZcseProbe"

[[lean_exe]]
name = "sched-probe"
root = "GoFVTest.SchedProbe"

[[lean_exe]]
name = "gofv-ssa-opt"
root = "GoFVTest.Driver.Main"

[[lean_exe]]
name = "rule-sat"
root = "GoFVTest.Proof.RuleSat"

[[lean_exe]]
name = "deadcode-probe"
root = "GoFVTest.DeadcodeProbe"

[[lean_exe]]
name = "cse-probe"
root = "GoFVTest.CseProbe"

[[lean_exe]]
name = "deadplan-probe"
root = "GoFVTest.DeadPlanProbe"
