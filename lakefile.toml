name = "gofv"
defaultTargets = ["GoFV"]

[[lean_lib]]
name = "GoFV"
globs = ["GoFV.+"]
# Linter warnings embed absolute paths in .oleans and defeat the shared cache (lean-build-hygiene).
weakLeanArgs = ["-Dlinter.unusedVariables=false", "-Dlinter.unusedSimpArgs=false", "-Dlinter.unnecessarySimpa=false", "-Dlinter.unusedSectionVars=false"]

[[lean_lib]]
name = "GoFVTest"
globs = ["GoFVTest.+"]
weakLeanArgs = ["-Dlinter.unusedVariables=false", "-Dlinter.unusedSimpArgs=false", "-Dlinter.unnecessarySimpa=false", "-Dlinter.unusedSectionVars=false"]

# lean_exe targets: each component appends its own [[lean_exe]] section below.
# Re-read this file right before editing it; other components edit it concurrently.

[[lean_exe]]
name = "ssa-roundtrip"
root = "GoFVTest.SSARoundtrip"
